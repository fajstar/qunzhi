let i = 0; const ans = {};
const who = document.getElementById('who');
who.value = localStorage.getItem('blind_who') || '';
who.oninput = () => localStorage.setItem('blind_who', who.value);
function render(){
  const pb = document.getElementById('pb');
  pb.style.width = (100*i/ITEMS.length) + '%';
  const m = document.getElementById('main');
  if(i >= ITEMS.length){ return finish(m); }
  const it = ITEMS[i];
  const prev = ans[it.id];
  m.innerHTML = '<div class="card"><div class="row">第 ' + (i+1) + ' / ' + ITEMS.length +
    ' 条 ｜ <span class="tag ' + it.label + '">被赋予标签：' + it.label + '</span>' +
    '<span class="tag">' + it.group + '</span>课题：' + it.topic + '</div>' +
    '<div class="q"><b>判据：</b>' + it.def + '</div>' +
    '<div class="txt">' + it.text.replace(/</g,'&lt;') + '</div>' +
    '<div class="btns">' +
    '<button class="y" onclick="pick(1)">符合<span class="k">1</span></button>' +
    '<button class="n" onclick="pick(0)">不符合<span class="k">2</span></button>' +
    '<button class="u" onclick="pick(-1)">不确定<span class="k">3</span></button></div>' +
    (prev!==undefined ? '<div class="row" style="margin-top:10px">本条已选：' +
      ({'1':'符合','0':'不符合','-1':'不确定'}[String(prev)]) + '（可直接改选）</div>' : '') +
    '</div>';
}
function pick(v){ ans[ITEMS[i].id] = v; i++; render(); }
function back(){ if(i>0){ i--; render(); } }
function finish(m){
  const n = Object.keys(ans).length;
  m.innerHTML = '<div class="card done"><h2 style="font-size:17px">已完成 ' + n + ' / ' +
    ITEMS.length + ' 条</h2><p style="color:#65676b;font-size:13px">' +
    (n<ITEMS.length ? '⚠️ 还有 ' + (ITEMS.length-n) + ' 条未标，可以点下面按钮回去补。' :
     '✅ 全部标完。点"导出结果"保存文件，交给评分脚本。') + '</p>' +
    '<div class="btns" style="margin-top:14px">' +
    '<button onclick="i=0;render()">回到开头检查</button>' +
    '<button class="y" onclick="submitCloud()">提交到云端</button>' +
    '<button onclick="save()">导出文件</button></div>' +
    '<div id="msg" class="row" style="margin-top:10px"></div>' +
    '<textarea readonly>' + JSON.stringify({verifier: who.value||'', answers: ans}) + '</textarea></div>';
}
function payload(){
  return {verifier: (who.value||'匿名'), answers: ans, n: Object.keys(ans).length,
          items: ITEMS.length, submitted_at: new Date().toISOString()};
}

  try{ return new URLSearchParams(location.search).get('key') || ''; }catch(e){ return ''; }
}
function submitCloud(){
  const m = document.getElementById('msg');
  const n = Object.keys(ans).length;
  const k = accessKey();
  if(!k){ m.innerHTML = '❌ 本页 URL 里没有 <code>?key=</code>，无法提交。<br>请用带口令的地址打开：<code>…/blind?key=你的口令</code>，或改用「导出文件」。'; return; }
  if(n < ITEMS.length && !confirm('还有 ' + (ITEMS.length-n) + ' 条没标，仍要提交吗？')) return;
  m.textContent = '提交中…';
  fetch('/api/blind/submit', {method:'POST',
                       headers:{'Content-Type':'application/json', 'X-Access-Key': k},
                       body: JSON.stringify(payload())})
    .then(r => r.json()).then(d => {
      m.innerHTML = d.ok ? ('✅ 已提交到云端：<b>' + d.saved + '</b>（' + d.n + ' 条）')
                         : ('❌ 提交失败：' + (d.detail||d.error||'未知'));
    })
    .catch(e => { m.innerHTML = '❌ 提交失败（' + e + '）。请改用「导出文件」把 JSON 发给组织者。'; });
}
function save(){
  const out = payload();
  const b = new Blob([JSON.stringify(out, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = 'blind_' + (who.value||'anon').replace(/[^\w\u4e00-\u9fa5]/g,'') + '.json';
  a.click();
}
document.addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT') return;
  if(e.key === '1') pick(1); else if(e.key === '2') pick(0);
  else if(e.key === '3') pick(-1); else if(e.key === 'ArrowLeft') back();
});
render();
</script></body></html>
