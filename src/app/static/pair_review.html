let i = 0; const ans = {};
const who = document.getElementById('who');
who.value = localStorage.getItem('pair_who') || '';
who.oninput = () => localStorage.setItem('pair_who', who.value);
function render(){
  document.getElementById('pb').style.width = (100*i/P.length) + '%';
  const m = document.getElementById('main');
  if(i >= P.length) return finish(m);
  const p = P[i];
  m.innerHTML = '<div class="row">第 ' + (i+1) + ' / ' + P.length + ' 对 ｜ ' + p.group +
    ' ｜ 课题：' + p.topic + '</div>' +
    '<div class="q">' + p.question + '</div>' +
    '<div class="opts">' +
    '<div class="opt" onclick="pick(\'left\')"><div class="lab">左边 ←</div>' + esc(p.left) + '</div>' +
    '<div class="opt" onclick="pick(\'right\')"><div class="lab">右边 →</div>' + esc(p.right) + '</div>' +
    '</div>';
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function pick(v){ ans[P[i].pair_id] = v; i++; render(); }
function payload(){
  return {task: '2afc', verifier: (who.value||'匿名'), answers: ans,
          n: Object.keys(ans).length, items: P.length,
          submitted_at: new Date().toISOString()};
}
function accessKey(){ try{ return new URLSearchParams(location.search).get('key')||''; }catch(e){ return ''; } }
function finish(m){
  // 本地先算一下成绩（页面不依赖服务端也能看结果）
  let ok = 0, done = 0; const byg = {};
  P.forEach(p => {
    const a = ans[p.pair_id]; if(!a) return;
    done++;
    const g = byg[p.group] = byg[p.group] || {ok:0,n:0};
    g.n++;
    if(a === p.answer){ ok++; g.ok++; }
  });
  let rows = '';
  for(const g in byg) rows += '<tr><td>'+g+'</td><td>'+byg[g].ok+' / '+byg[g].n+
    '</td><td>'+Math.round(100*byg[g].ok/byg[g].n)+'%</td></tr>';
  m.innerHTML = '<div class="done"><h2 style="font-size:17px">已判 '+done+' / '+P.length+' 对</h2>' +
    '<p style="color:#65676b;font-size:13px">本次正确率（猜中率 50%）：<b>'+
    (done? Math.round(100*ok/done)+'%' : '—')+'</b></p>' +
    (rows? '<table><tr><th>组</th><th>正确</th><th>正确率</th></tr>'+rows+'</table>' : '') +
    '<div style="margin-top:14px"><button onclick="i=0;render()">回到开头</button>' +
    '<button class="y" onclick="submitCloud()">提交到云端</button>' +
    '<button onclick="save()">导出文件</button></div>' +
    '<div id="msg" style="margin-top:10px;font-size:13px"></div></div>';
}
function submitCloud(){
  const m = document.getElementById('msg'), k = accessKey();
  if(!k){ m.innerHTML = '❌ 本页 URL 无 <code>?key=</code>，无法提交。请用带口令的地址打开。'; return; }
  m.textContent = '提交中…';
  fetch('/api/blind/submit', {method:'POST',
    headers:{'Content-Type':'application/json','X-Access-Key':k},
    body: JSON.stringify(payload())})
    .then(r=>r.json()).then(d=>{ m.innerHTML = d.ok ? ('✅ 已提交：<b>'+d.saved+'</b>') :
      ('❌ 失败：'+(d.detail||d.error||'未知')); })
    .catch(e=>{ m.innerHTML = '❌ 失败（'+e+'），请改用「导出文件」。'; });
}
function save(){
  const b = new Blob([JSON.stringify(payload(),null,1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = 'pair_' + (who.value||'anon').replace(/[^\w\u4e00-\u9fa5]/g,'') + '.json';
  a.click();
}
document.addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT') return;
  if(e.key === 'ArrowLeft') pick('left');
  else if(e.key === 'ArrowRight') pick('right');
});
render();
</script></body></html>
