<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎭 欺诈游戏 · AI竞技场</title>
    <style>
        :root {
            --bg: #0a0a0c;
            --surface: #131317;
            --surface-light: #1a1a21;
            --border: #2a2a35;
            --text: #d0d0d8;
            --text-dim: #6b6b78;
            --accent: #c59b5f;
            --accent-glow: #e0b878;
            --green: #4caf50;
            --red: #e05555;
            --blue: #5a9fd4;
            --gold: #e0b878;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', 'Courier New', monospace;
            background: var(--bg);
            color: var(--text);
            padding: 24px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            line-height: 1.5;
        }
        .container { width: 100%; max-width: 1600px; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #f0e6d3;
            text-shadow: 0 0 20px rgba(197, 155, 95, 0.3);
        }
        .header h1 span { color: var(--accent); }
        .badge-group { display: flex; gap: 12px; flex-wrap: wrap; }
        .badge {
            background: var(--surface-light);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            font-size: 13px;
            color: var(--text-dim);
            backdrop-filter: blur(4px);
        }
        .badge.active { border-color: var(--green); color: var(--green); box-shadow: 0 0 8px rgba(76, 175, 80, 0.2); }
        .badge.perfect { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 8px rgba(224, 184, 120, 0.3); }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 24px;
            padding: 14px 18px;
            background: var(--surface);
            border-radius: 12px;
            border: 1px solid var(--border);
            align-items: center;
        }
        .controls button {
            background: var(--surface-light);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            font-family: inherit;
        }
        .controls button:hover { background: #2a2a35; border-color: #555; color: #fff; }
        .controls button.primary { background: rgba(197, 155, 95, 0.15); border-color: var(--accent); color: var(--accent-glow); }
        .controls button.primary:hover { background: rgba(197, 155, 95, 0.25); }
        .controls button.batch { background: rgba(90, 159, 212, 0.15); border-color: var(--blue); color: var(--blue); }
        .controls button.batch:hover { background: rgba(90, 159, 212, 0.25); }
        .controls button.danger { border-color: var(--red); color: var(--red); }
        .controls button.danger:hover { background: rgba(224, 85, 85, 0.15); }
        .controls select {
            background: var(--surface-light);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            outline: none;
        }
        .controls .sep { color: var(--border); padding: 0 6px; }
        .controls label {
            color: var(--text-dim);
            font-size: 13px;
            margin-left: 10px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .controls label input[type="checkbox"] { accent-color: var(--accent); cursor: pointer; width: 16px; height: 16px; }
        .controls input[type="number"] {
            background: var(--surface-light);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 8px;
            border-radius: 6px;
            width: 55px;
            text-align: center;
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }
        .controls input[type="number"]:focus { border-color: var(--accent); }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }
        @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }
        .players-panel {
            background: var(--surface);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 16px;
            max-height: 750px;
            overflow-y: auto;
        }
        .players-panel::-webkit-scrollbar { width: 5px; }
        .players-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        .section-title {
            font-size: 13px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }
        .world-rules-box {
            background: var(--surface-light);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 16px;
            border-left: 3px solid var(--accent);
            font-size: 12px;
            color: var(--text-dim);
            max-height: 120px;
            overflow-y: auto;
        }
        .world-rules-box .rule-item { padding: 2px 0; }
        .player-card {
            background: var(--surface-light);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            border-left: 3px solid var(--border);
            transition: all 0.3s;
        }
        .player-card:hover { border-left-color: var(--accent); }
        .player-card.dead { opacity: 0.55; border-left-color: #444; }
        .player-card.perfect-card { border-left-color: var(--gold); box-shadow: 0 0 12px rgba(224, 184, 120, 0.15); }
        .player-card .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            gap: 8px;
            flex-wrap: wrap;
        }
        .player-card .name {
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .player-card .score { font-size: 14px; font-weight: 600; color: var(--accent); }
        .prototype-tag {
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .prototype-tag.hunter { border-color: #e05555; color: #e05555; }
        .prototype-tag.trader { border-color: #4caf7c; color: #4caf7c; }
        .prototype-tag.ghost { border-color: #8a9bb5; color: #8a9bb5; }
        .prototype-tag.gambler { border-color: #e0b878; color: #e0b878; }
        .prototype-tag.diplomat { border-color: #5a9fd4; color: #5a9fd4; }
        .prototype-tag.skeptic { border-color: #c084c0; color: #c084c0; }
        .status-badge {
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 12px;
            background: rgba(76, 175, 80, 0.1);
            color: var(--green);
            border: 1px solid rgba(76, 175, 80, 0.3);
        }
        .status-badge.dead { background: rgba(224, 85, 85, 0.1); color: var(--red); border-color: rgba(224, 85, 85, 0.3); }
        .color-dot {
            display: inline-block;
            width: 10px; height: 10px;
            border-radius: 50%;
            margin-right: 4px;
            box-shadow: 0 0 6px currentColor;
        }
        .color-dot.red { background: #e05555; color: #e05555; }
        .color-dot.blue { background: #5a9fd4; color: #5a9fd4; }
        .color-dot.green { background: #4caf7c; color: #4caf7c; }
        .self-info-line {
            font-size: 11px;
            color: #b0a090;
            background: rgba(197, 155, 95, 0.08);
            padding: 4px 8px;
            border-radius: 4px;
            margin: 6px 0;
            border-left: 2px solid var(--accent);
            word-break: break-word;
        }
        .belief-indicator {
            font-size: 11px;
            color: #8ab4d8;
            background: rgba(90, 159, 212, 0.08);
            padding: 4px 8px;
            border-radius: 4px;
            margin: 4px 0;
            border-left: 2px solid var(--blue);
        }
        .clue-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin: 6px 0;
        }
        .clue-chip {
            font-size: 11px;
            background: rgba(90, 159, 212, 0.1);
            border: 1px solid rgba(90, 159, 212, 0.2);
            border-radius: 12px;
            padding: 2px 8px;
            color: #9ac0e0;
            white-space: nowrap;
        }
        .clue-chip.verified-true { border-color: var(--green); color: var(--green); background: rgba(76, 175, 80, 0.1); }
        .clue-chip.verified-false { border-color: var(--red); color: var(--red); background: rgba(224, 85, 85, 0.1); }
        .emotion-row {
            display: flex;
            gap: 8px;
            font-size: 11px;
            color: var(--text-dim);
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .emotion-row span { display: flex; align-items: center; gap: 3px; }
        .emotion-value { font-weight: 600; }
        .emotion-bar {
            width: 30px; height: 4px;
            border-radius: 2px;
            background: #2a2a2a;
            display: inline-block;
            vertical-align: middle;
            overflow: hidden;
        }
        .emotion-bar-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.3s;
        }
        .emotion-bar-fill.trust { background: #6a8a8a; }
        .emotion-bar-fill.frustration { background: #b55; }
        .emotion-bar-fill.superiority { background: #e8c88a; }
        .emotion-bar-fill.insecurity { background: #8a7a9a; }
        .probe-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            background: rgba(197, 155, 95, 0.1);
            border: 1px solid var(--accent);
            color: var(--accent-glow);
        }
        .probe-badge.used { border-color: var(--text-dim); color: var(--text-dim); background: transparent; }
        .coach-panel {
            background: var(--surface-light);
            border-radius: 8px;
            padding: 12px;
            margin-top: 16px;
            border-left: 3px solid var(--accent-glow);
        }
        .coach-panel .coach-title {
            font-size: 12px;
            color: var(--accent-glow);
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .coach-panel .coach-summary {
            font-size: 11px;
            color: #aaa;
            line-height: 1.5;
        }
        .log-panel {
            background: var(--surface);
            border-radius: 12px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            max-height: 750px;
        }
        .log-header {
            display: flex;
            justify-content: space-between;
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            color: var(--text-dim);
            flex-shrink: 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .log-body {
            flex: 1;
            overflow-y: auto;
            padding: 12px 18px;
            font-size: 13px;
            line-height: 1.7;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .log-body::-webkit-scrollbar { width: 5px; }
        .log-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        .log-body .msg { margin-bottom: 3px; padding: 2px 0; }
        .log-body .msg .time { color: #444; margin-right: 8px; font-size: 11px; }
        .log-body .msg.chat { color: #b8d4e8; }
        .log-body .msg.private { color: #d4b0c8; }
        .log-body .msg.system { color: #8a9a7a; }
        .log-body .msg.thinking { color: #7a8a9a; font-style: italic; }
        .log-body .msg.result { color: var(--accent-glow); }
        .log-body .msg.error { color: var(--red); }
        .log-body .msg.perfect { color: var(--gold); font-weight: 700; font-size: 14px; }
        .log-body .msg.verification {
            color: var(--gold);
            background: rgba(224, 184, 120, 0.08);
            padding: 3px 8px;
            border-radius: 4px;
            border-left: 2px solid var(--gold);
        }
        .log-body .msg.minority { color: #8ac8d8; }
        .score-section {
            margin-top: 20px;
            padding: 16px;
            background: var(--surface);
            border-radius: 12px;
            border: 1px solid var(--border);
            display: none;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .score-section.active { display: flex; }
        .score-section label { font-size: 13px; color: var(--text-dim); }
        .score-section input {
            background: var(--surface-light);
            border: 1px solid var(--border);
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            width: 60px;
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }
        .score-section button { background: var(--surface-light); border: 1px solid var(--border); color: var(--text); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 13px; }
        .score-section button:hover { background: #2a2a35; }
        .auto-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            background: rgba(90, 159, 212, 0.1);
            border: 1px solid var(--blue);
            color: var(--blue);
            margin-left: 8px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🎭 欺诈游戏 · <span>AI竞技场</span></h1>
        <div class="badge-group">
            <span class="badge" id="gameStatus">⏸ 未开始</span>
            <span class="badge" id="roundDisplay">第 0 局</span>
            <span class="badge" id="modeDisplay">标准</span>
            <span class="badge" id="gameModeDisplay">深度</span>
            <span class="badge" id="batchBadge" style="display:none;">🔄 连跑中</span>
        </div>
    </div>
    <div class="controls">
        <button class="primary" onclick="doStart()">▶ 单局</button>
        <button class="batch" onclick="doStartBatch()">▶ 连跑</button>
        <input type="number" id="batchCount" value="5" min="1" max="50" title="连续跑局数量" />
        <button class="danger" onclick="doStop()">⏹ 停止</button>
        <button onclick="doReset()">🔄 重置</button>
        <span class="sep">|</span>
        <span style="color:var(--text-dim);font-size:13px;">API模式：</span>
        <select id="modeSelect">
            <option value="极速">极速</option>
            <option value="标准" selected>标准</option>
            <option value="深度">深度</option>
        </select>
        <button onclick="doSetMode()">切换</button>
        <span class="sep">|</span>
        <span style="color:var(--text-dim);font-size:13px;">游戏智能：</span>
        <select id="gameModeSelect">
            <option value="轻量">轻量</option>
            <option value="标准">标准</option>
            <option value="深度" selected>深度</option>
        </select>
        <button onclick="doSetGameMode()">切换</button>
        <span class="sep">|</span>
        <button onclick="doSaveScore()" style="border-color:#5a5a5a;color:#aaa;">📊 评分</button>
        <span class="sep">|</span>
        <label><input type="checkbox" id="showClues" checked /> 线索</label>
        <label><input type="checkbox" id="showEmotion" checked /> 情感</label>
    </div>
    <div class="main-grid">
        <div class="players-panel" id="playersPanel">
            <div class="section-title">⚔️ 玩家状态 · 上帝视角</div>
            <div class="world-rules-box" id="worldRulesBox" style="display:none;">
                <div style="font-size:12px;color:var(--accent);margin-bottom:4px;">📜 世界规则候选</div>
                <div id="worldRulesList"></div>
            </div>
            <div id="playerList"></div>
            <div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--border);font-size:11px;color:var(--text-dim);">
                原型：<span style="color:#e88;">猎手</span> · <span style="color:#8d8;">商人</span> · <span style="color:#aac;">隐士</span> · <span style="color:#e8d88a;">赌徒</span> · <span style="color:#8ac8d8;">外交家</span> · <span style="color:#d8aac8;">多疑者</span>
            </div>
            <div class="coach-panel" id="coachPanel">
                <div class="coach-title">🧠 教练洞察 · 最新</div>
                <div class="coach-summary" id="coachSummary">等待对局数据...</div>
            </div>
        </div>
        <div class="log-panel">
            <div class="log-header">
                <span>📜 实时日志</span>
                <span class="count" id="logCount">0 条</span>
            </div>
            <div class="log-body" id="logBody">
                <div class="msg system">🔄 等待游戏开始...</div>
            </div>
        </div>
    </div>
    <div class="score-section" id="scoreSection">
        <label>策略多样性</label><input id="s1" type="number" min="0" max="10" value="5" />
        <label>博弈张力</label><input id="s2" type="number" min="0" max="10" value="5" />
        <label>局势反转</label><input id="s3" type="number" min="0" max="10" value="5" />
        <label>决策质量</label><input id="s4" type="number" min="0" max="10" value="5" />
        <label>信息不对称</label><input id="s5" type="number" min="0" max="10" value="5" />
        <button onclick="doSubmitScore()">💾 保存</button>
        <span id="scoreResult" style="color:var(--text-dim);font-size:13px;"></span>
    </div>
</div>
<script>
    let logCount = 0;
    let sseRetryTimer = null;
    let pollTimer = null;
    let coachTimer = null;

    const prototypeNames = {
        'hunter': '猎手', 'trader': '商人', 'ghost': '隐士',
        'gambler': '赌徒', 'diplomat': '外交家', 'skeptic': '多疑者'
    };
    const colorClassMap = {'红':'red', '蓝':'blue', '绿':'green'};

    function renderPlayers(players) {
        const container = document.getElementById('playerList');
        if (!players || players.length === 0) {
            container.innerHTML = '<div style="color:var(--text-dim);font-size:13px;padding:8px 0;">暂无玩家数据</div>';
            return;
        }
        const showClues = document.getElementById('showClues')?.checked ?? true;
        const showEmotion = document.getElementById('showEmotion')?.checked ?? true;
        let html = '';
        for (const p of players) {
            const aliveClass = p.alive ? '' : 'dead';
            const aliveLabel = p.alive ? '🟢 存活' : '💀 出局';
            const proto = p.prototype || 'unknown';
            const protoName = prototypeNames[proto] || proto;
            const colorDot = p.color ? `<span class="color-dot ${colorClassMap[p.color] || ''}"></span>` : '';
            let selfInfoHtml = '';
            if (p.self_info) {
                selfInfoHtml = `<div class="self-info-line">📩 ${p.self_info}</div>`;
            }
            let beliefHtml = '';
            if (p.belief && p.belief.most_likely_color) {
                const b = p.belief;
                beliefHtml = `<div class="belief-indicator">🎯 信念：${b.most_likely_color}（强度 ${(b.strength*100).toFixed(0)}%，置信度 ${(b.confidence*100).toFixed(0)}%）</div>`;
            }
            let clueHtml = '';
            if (showClues && p.clues && p.clues.length > 0) {
                const chips = p.clues.map(c => {
                    let cls = 'clue-chip';
                    if (c.verified && c.credibility >= 0.99) cls += ' verified-true';
                    else if (c.verified && c.credibility < 0.5) cls += ' verified-false';
                    return `<span class="${cls}">${c.target}:${c.color}(${Math.round(c.credibility*100)}%)</span>`;
                }).join('');
                clueHtml = `<div class="clue-chips">${chips}</div>`;
            }
            let emotionHtml = '';
            if (showEmotion && p.emotion) {
                const em = p.emotion;
                const maxVal = 1.0;
                emotionHtml = `
                    <div class="emotion-row">
                        <span>🤝 <span class="emotion-value">${(em.trust || 0).toFixed(2)}</span>
                            <span class="emotion-bar"><span class="emotion-bar-fill trust" style="width:${Math.abs(em.trust||0)/maxVal*100}%"></span></span>
                        </span>
                        <span>😤 <span class="emotion-value">${(em.frustration || 0).toFixed(2)}</span>
                            <span class="emotion-bar"><span class="emotion-bar-fill frustration" style="width:${Math.abs(em.frustration||0)/maxVal*100}%"></span></span>
                        </span>
                        <span>😎 <span class="emotion-value">${(em.superiority || 0).toFixed(2)}</span>
                            <span class="emotion-bar"><span class="emotion-bar-fill superiority" style="width:${Math.abs(em.superiority||0)/maxVal*100}%"></span></span>
                        </span>
                        <span>😰 <span class="emotion-value">${(em.insecurity || 0).toFixed(2)}</span>
                            <span class="emotion-bar"><span class="emotion-bar-fill insecurity" style="width:${Math.abs(em.insecurity||0)/maxVal*100}%"></span></span>
                        </span>
                    </div>`;
            }
            let probeHtml = '';
            if (p.rule_probe_available !== undefined) {
                probeHtml = p.rule_probe_available
                    ? '<span class="probe-badge">🔎 探针可用</span>'
                    : '<span class="probe-badge used">探针已用</span>';
            }
            html += `
                <div class="player-card ${aliveClass}">
                    <div class="card-header">
                        <span class="name">${colorDot}${p.name}</span>
                        <span class="score">${p.score || 0}分</span>
                        <span class="prototype-tag ${proto}">${protoName}</span>
                        <span class="status-badge ${aliveClass}">${aliveLabel}</span>
                        ${probeHtml}
                    </div>
                    ${selfInfoHtml}
                    ${beliefHtml}
                    ${emotionHtml}
                    ${clueHtml}
                </div>`;
        }
        container.innerHTML = html;
    }

    function appendLog(message) {
        const body = document.getElementById('logBody');
        if (body.children.length === 1 && body.children[0].textContent.includes('等待游戏开始')) {
            body.innerHTML = '';
        }
        const line = document.createElement('div');
        let cls = 'system';
        if (message.includes('📢')) cls = 'chat';
        else if (message.includes('🔒')) cls = 'private';
        else if (message.includes('🔍') || message.includes('验证了线索') || message.includes('使用规则探针')) cls = 'verification';
        else if (message.includes('🧠') || message.includes('🌳') || message.includes('💭')) cls = 'thinking';
        else if (message.includes('完美结局') || message.includes('🌈')) cls = 'perfect';
        else if (message.includes('✅') || message.includes('❌') || message.includes('🏆')) cls = 'result';
        else if (message.includes('⚠️')) cls = 'error';
        else if (message.includes('少数决')) cls = 'minority';
        line.className = `msg ${cls}`;
        const now = new Date();
        const ts = now.toTimeString().slice(0, 8);
        const timeSpan = document.createElement('span');
        timeSpan.className = 'time';
        timeSpan.textContent = ts;
        line.appendChild(timeSpan);
        const textSpan = document.createElement('span');
        textSpan.textContent = message;
        line.appendChild(textSpan);
        body.appendChild(line);
        body.scrollTop = body.scrollHeight;
        logCount++;
        document.getElementById('logCount').textContent = logCount + ' 条';
        // 超过1000条清理旧日志
        if (body.children.length > 1000) {
            for (let i = 0; i < 200; i++) {
                if (body.firstChild) body.removeChild(body.firstChild);
            }
        }
    }

    function fetchCoachSummary() {
        fetch('/coach_latest')
            .then(res => {
                if (!res.ok) throw new Error('接口不可用');
                return res.json();
            })
            .then(data => {
                const el = document.getElementById('coachSummary');
                if (el && data.summary) {
                    el.textContent = data.summary;
                }
            })
            .catch(() => {});
    }

    function updateStatus(data) {
        const statusEl = document.getElementById('gameStatus');
        if (data.running) {
            statusEl.textContent = '▶ 运行中';
            statusEl.className = 'badge active';
        } else {
            statusEl.textContent = '⏸ 已停止';
            statusEl.className = 'badge';
        }
        document.getElementById('roundDisplay').textContent = `第 ${data.current_round || 0} 局`;
        document.getElementById('modeDisplay').textContent = data.current_mode || '标准';
        document.getElementById('gameModeDisplay').textContent = data.current_game_mode || '深度';

        // 连续跑局状态
        const batchBadge = document.getElementById('batchBadge');
        if (data.auto_run_limit && data.auto_run_count < data.auto_run_limit) {
            batchBadge.style.display = 'inline';
            batchBadge.textContent = `🔄 连跑 ${data.auto_run_count+1}/${data.auto_run_limit}`;
        } else if (data.auto_run_limit && data.auto_run_count >= data.auto_run_limit) {
            batchBadge.style.display = 'none';
        } else {
            batchBadge.style.display = 'none';
        }

        if (data.players) renderPlayers(data.players);
    }

    function connectSSE() {
        if (sseRetryTimer) clearTimeout(sseRetryTimer);
        const evtSource = new EventSource('/stream');
        evtSource.onmessage = function(e) {
            if (e.data && e.data.trim()) {
                const msg = e.data.trim();
                appendLog(msg);
            }
            fetchState();
        };
        evtSource.onerror = function() {
            evtSource.close();
            sseRetryTimer = setTimeout(connectSSE, 3000);
        };
        window.addEventListener('beforeunload', () => evtSource.close());
    }

    async function fetchState() {
        try {
            const resp = await fetch('/state');
            const data = await resp.json();
            updateStatus(data);
        } catch(e) {}
    }

    async function doStart() {
        await fetch('/start', { method: 'POST' });
        fetchState();
    }

    async function doStartBatch() {
        const count = parseInt(document.getElementById('batchCount').value) || 5;
        try {
            await fetch('/start_batch', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ count: count })
            });
            fetchState();
        } catch(e) {
            console.error('启动连续跑局失败:', e);
        }
    }

    async function doStop() {
        await fetch('/stop', { method: 'POST' });
        fetchState();
    }

    async function doReset() {
        if (confirm('重置所有数据？此操作不可恢复。')) {
            await fetch('/reset', { method: 'POST' });
            document.getElementById('logBody').innerHTML = '<div class="msg system">🔄 已重置</div>';
            logCount = 0;
            document.getElementById('logCount').textContent = '0 条';
            fetchState();
        }
    }

    async function doSetMode() {
        const mode = document.getElementById('modeSelect').value;
        await fetch('/set_mode', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mode }) });
        fetchState();
    }

    async function doSetGameMode() {
        const gameMode = document.getElementById('gameModeSelect').value;
        await fetch('/set_game_mode', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ game_mode: gameMode }) });
        fetchState();
    }

    function doSaveScore() {
        document.getElementById('scoreSection').classList.toggle('active');
    }

    function doSubmitScore() {
        const s1 = parseFloat(document.getElementById('s1').value) || 0;
        const s2 = parseFloat(document.getElementById('s2').value) || 0;
        const s3 = parseFloat(document.getElementById('s3').value) || 0;
        const s4 = parseFloat(document.getElementById('s4').value) || 0;
        const s5 = parseFloat(document.getElementById('s5').value) || 0;
        const total = ((s1+s2+s3+s4+s5)/5)*10;
        const rating = total >= 80 ? '高质 🏆' : total >= 60 ? '中等' : '低质';
        document.getElementById('scoreResult').textContent = `得分 ${total.toFixed(1)} 分 — ${rating}`;
        fetch('/save_score', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ scores: {s1,s2,s3,s4,s5}, total: total.toFixed(1) }) }).catch(()=>{});
    }

    document.getElementById('showClues')?.addEventListener('change', fetchState);
    document.getElementById('showEmotion')?.addEventListener('change', fetchState);

    // 初始化
    fetchState();
    connectSSE();
    pollTimer = setInterval(fetchState, 6000);
    fetchCoachSummary();
    coachTimer = setInterval(fetchCoachSummary, 30000);

    // 清理
    window.addEventListener('beforeunload', () => {
        if (pollTimer) clearInterval(pollTimer);
        if (coachTimer) clearInterval(coachTimer);
        if (sseRetryTimer) clearTimeout(sseRetryTimer);
    });

    console.log('🎭 欺诈游戏 · AI竞技场 已加载 (优化版·支持连续跑局)');
</script>
</body>
</html>
